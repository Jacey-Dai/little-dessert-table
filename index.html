<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f2e7">
<title>小小甜品桌</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header><a href="./" class="brand"><span>小小甜品桌</span><small>Little Dessert Table</small></a><button id="undo">撤销</button></header>
<main>
<nav id="steps" aria-label="制作步骤"></nav>
